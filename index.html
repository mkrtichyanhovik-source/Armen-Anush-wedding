<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Արմեն & Անուշ | 09.09.2026</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
:root {
  --gold: #D4AF37;
  --cream: #F5F1E8;
  --dark: #1a1a1a;
  --text: #2c2c2c;
}
body {
  font-family: 'Montserrat', sans-serif;
  background-color: var(--cream);
  color: var(--text);
  overflow-x: hidden;
}
h1, h2, h3 {
  font-family: 'Cormorant Garamond', serif;
}

/* Seal Section */
.seal-section {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #faf8f3 0%, #f5f1e8 100%);
  position: relative;
  overflow: hidden;
}
.seal-section::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background:
    radial-gradient(circle at 20% 50%, rgba(212, 175, 55, 0.05) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.05) 0%, transparent 50%);
  pointer-events: none;
}
.seal-label {
  font-size: 0.85rem;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: #999;
  margin-bottom: 30px;
  opacity: 0;
  animation: fadeIn 1.5s ease forwards 0.5s;
}
.seal-container {
  position: relative;
  cursor: pointer;
  transition: transform 0.4s ease;
}
.seal-container:hover {
  transform: scale(1.05);
}
.seal {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: linear-gradient(145deg, #f0ece0 0%, #e8e4d8 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  box-shadow:
    0 20px 60px rgba(0,0,0,0.15),
    inset 0 2px 10px rgba(255,255,255,0.8),
    inset 0 -2px 10px rgba(0,0,0,0.05),
    0 0 0 8px rgba(212, 175, 55, 0.1),
    0 0 0 12px rgba(212, 175, 55, 0.05);
  border: 3px solid rgba(212, 175, 55, 0.3);
}
.seal::before {
  content: '';
  position: absolute;
  width: 90%;
  height: 90%;
  border-radius: 50%;
  border: 2px solid rgba(212, 175, 55, 0.2);
}
.seal::after {
  content: '';
  position: absolute;
  width: 85%;
  height: 85%;
  border-radius: 50%;
  border: 1px dashed rgba(212, 175, 55, 0.3);
  animation: rotate 30s linear infinite;
}
.seal-content {
  text-align: center;
  z-index: 1;
}
.seal-initials {
  font-family: 'Cormorant Garamond', serif;
  font-size: 4rem;
  font-weight: 400;
  color: var(--dark);
  letter-spacing: 5px;
  line-height: 1;
}
.seal-amp {
  font-size: 1.5rem;
  color: var(--gold);
  display: block;
  margin: 5px 0;
  font-style: italic;
}
.seal-instruction {
  margin-top: 30px;
  font-size: 0.85rem;
  color: #999;
  letter-spacing: 2px;
  opacity: 0;
  animation: fadeIn 1.5s ease forwards 1s;
}
.pulse {
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
@keyframes rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
@keyframes fadeIn {
  to { opacity: 1; }
}

/* Main Content */
.main-content {
  display: none;
  animation: fadeInContent 1s ease;
}
@keyframes fadeInContent {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Header */
.header {
  text-align: center;
  padding: 80px 20px 60px;
  background: linear-gradient(to bottom, #fff, var(--cream));
}
.header-title {
  font-size: 3rem;
  font-weight: 300;
  letter-spacing: 5px;
  margin-bottom: 10px;
  color: var(--dark);
}
.header-subtitle {
  font-size: 0.9rem;
  letter-spacing: 3px;
  color: #999;
  margin-bottom: 40px;
}
.scroll-indicator {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  animation: bounce 2s infinite;
  z-index: 100;
}
.scroll-arrow {
  width: 30px;
  height: 50px;
  border: 2px solid var(--gold);
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 10px;
}
.scroll-arrow::before {
  content: '↓';
  color: var(--gold);
  font-size: 1.5rem;
}
.scroll-text {
  font-size: 0.75rem;
  letter-spacing: 2px;
  color: #999;
}
@keyframes bounce {
  0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); }
  40% { transform: translateX(-50%) translateY(-10px); }
  60% { transform: translateX(-50%) translateY(-5px); }
}

/* Countdown */
.countdown-section {
  padding: 120px 20px;
  text-align: center;
  background: url('https://images.unsplash.com/photo-1519741497674-611481863552?w=1200&q=80') center/cover fixed;
  position: relative;
}
.countdown-section::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.5);
}
.countdown-content {
  position: relative;
  z-index: 1;
  color: #fff;
}
.countdown-title {
  font-size: 1.2rem;
  letter-spacing: 3px;
  margin-bottom: 40px;
}
.countdown {
  display: flex;
  justify-content: center;
  gap: 30px;
  flex-wrap: wrap;
}
.countdown-item {
  text-align: center;
  padding: 20px;
  min-width: 100px;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  border-radius: 10px;
}
.countdown-number {
  font-family: 'Cormorant Garamond', serif;
  font-size: 3.5rem;
  font-weight: 300;
  color: var(--gold);
  display: block;
  line-height: 1;
}
.countdown-label {
  font-size: 0.8rem;
  letter-spacing: 2px;
  color: #ccc;
  margin-top: 10px;
  display: block;
}

/* Calendar */
.calendar-section {
  padding: 60px 20px;
  background: #fff;
  text-align: center;
}
.calendar-title {
  font-size: 1.5rem;
  letter-spacing: 3px;
  margin-bottom: 40px;
}
.calendar {
  max-width: 400px;
  margin: 0 auto;
  background: var(--cream);
  padding: 30px;
  border-radius: 10px;
}
.calendar-header {
  font-size: 1.2rem;
  margin-bottom: 20px;
  color: var(--dark);
}
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 10px;
}
.calendar-day-header {
  font-size: 0.75rem;
  color: #999;
  padding: 10px 5px;
  text-align: center;
}
.calendar-day {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.9rem;
  border-radius: 50%;
  transition: all 0.3s;
}
.calendar-day.highlighted {
  background: var(--gold);
  color: #fff;
  font-weight: 500;
  box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
}

/* Message */
.message {
  padding: 80px 20px;

  text-align: center;
  background: linear-gradient(to bottom, var(--cream), #fff);
}
.message-text {
  max-width: 700px;
  margin: 0 auto;
  font-size: 1.1rem;
  line-height: 2;
  color: var(--text);
  font-style: italic;
}

/* Schedule */
.schedule {
  padding: 80px 20px;
  background: #fff;
}
.schedule-title {
  text-align: center;
  font-size: 2rem;
  letter-spacing: 3px;
  margin-bottom: 60px;
}
.schedule-grid {
  max-width: 900px;
  margin: 0 auto;
  display: grid;
  gap: 30px;
}
.schedule-item {
  display: flex;
  align-items: center;
  padding: 30px;
  background: var(--cream);
  border-radius: 10px;
  transition: transform 0.3s;
}
.schedule-item:hover {
  transform: translateX(10px);
}
.schedule-time {
  font-size: 1.5rem;
  color: var(--gold);
  min-width: 100px;
  font-weight: 500;
}
.schedule-info h3 {
  font-size: 1.3rem;
  margin-bottom: 5px;
}
.schedule-info p {
  font-size: 0.9rem;
  color: #999;
}

/* Locations */
.locations {
  padding: 80px 20px;
  background: var(--cream);
}
.locations-title {
  text-align: center;
  font-size: 2rem;
  letter-spacing: 3px;
  margin-bottom: 60px;
}
.locations-grid {
  max-width: 900px;
  margin: 0 auto;
  display: grid;
  gap: 40px;
}
.location-card {
  background: #fff;
  padding: 40px;
  border-radius: 10px;
  text-align: center;
  transition: transform 0.3s, box-shadow 0.3s;
}
.location-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 15px 40px rgba(0,0,0,0.1);
}
.location-card h3 {
  font-size: 1.5rem;
  margin-bottom: 20px;
  color: var(--gold);
}
.location-card p {
  font-size: 0.95rem;
  line-height: 1.8;
  margin-bottom: 20px;
}
.location-card a {
  display: inline-block;
  padding: 12px 30px;
  background: var(--dark);
  color: #fff;
  text-decoration: none;
  border-radius: 25px;
  font-size: 0.85rem;
  letter-spacing: 1px;
  transition: all 0.3s;
}
.location-card a:hover {
  background: var(--gold);
  transform: translateY(-2px);
}

/* Photo Collage Section */
.photo-collage-section {
  padding: 80px 20px;
  background: #fff;
}
.photo-collage-title {
  text-align: center;
  font-size: 1.8rem;
  letter-spacing: 3px;
  margin-bottom: 50px;
  color: var(--dark);
}
.photo-collage {
  max-width: 1000px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  padding: 20px;
}
.photo-item {
  position: relative;
  overflow: hidden;
  border-radius: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  transition: transform 0.3s;
  aspect-ratio: 3/4;
}
.photo-item:hover {
